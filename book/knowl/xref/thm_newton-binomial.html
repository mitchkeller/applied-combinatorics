<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">8.10</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Newton’s Binomial Theorem.</span>

<div class="para logical">
<div class="para">For all real <span class="process-math">\(p\)</span> with <span class="process-math">\(p\neq0\text{,}\)</span>
</div>
<div class="displaymath process-math">

\end{equation*}
